
name: Continuous Training

on:
  workflow_dispatch:
    inputs:
      dataset_version:
        description: "Dataset version to use for retraining"
        required: true
        type: choice
        options:
          - v1
          - v2
        default: v2

permissions:
  contents: read

jobs:
  continuous-training:
    name: Validate, Train and Evaluate
    runs-on: ubuntu-latest

  env:
    MLFLOW_TRACKING_URI: ${{ vars.MLFLOW_TRACKING_URI }}
    MLFLOW_TRACKING_USERNAME: ${{ vars.MLFLOW_TRACKING_USERNAME }}
    MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
    AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
    AZURE_STORAGE_SAS_TOKEN: ${{ secrets.AZURE_STORAGE_SAS_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "dvc[azure]"

      - name: Configure DVC authentication
        run: |
          dvc remote modify --local myazure account_name "$AZURE_STORAGE_ACCOUNT"
          dvc remote modify --local myazure sas_token "$AZURE_STORAGE_SAS_TOKEN"

      - name: Retrieve datasets from Azure
        run: dvc pull

      - name: Validate datasets
        run: |
          python -c "from ml.data_validation import validate_version, validate_cross_version_consistency; validate_version('${{ inputs.dataset_version }}'); validate_cross_version_consistency()"

      - name: Run Continuous Training (dry run)
        run: |
          python -m ml.continuous_training --version "${{ inputs.dataset_version }}"
