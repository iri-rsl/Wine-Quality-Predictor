
name: Continuous Training

on:
  workflow_dispatch:
    inputs:
      dataset_version:
        description: "Dataset version to use"
        required: true
        type: choice
        options:
          - v1
          - v2
        default: v2

      allow_promotion:
        description: "Enable production promotion and model refresh"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: continuous-training
  cancel-in-progress: false

jobs:
  continuous-training:
    name: Validate, Train, Evaluate and Refresh
    runs-on: ubuntu-latest

    env:
      MLFLOW_TRACKING_URI: ${{ vars.MLFLOW_TRACKING_URI }}
      MLFLOW_TRACKING_USERNAME: ${{ vars.MLFLOW_TRACKING_USERNAME }}
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
      AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
      AZURE_STORAGE_SAS_TOKEN: ${{ secrets.AZURE_STORAGE_SAS_TOKEN }}
      APP_URL: ${{ vars.RENDER_PRODUCTION_URL }}
      ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
      MODEL_NAME: WineQualityPredictor

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "dvc[azure]"

      - name: Configure Azure DVC remote
        run: |
          dvc remote modify --local myazure account_name "$AZURE_STORAGE_ACCOUNT"
          dvc remote modify --local myazure sas_token "$AZURE_STORAGE_SAS_TOKEN"

      - name: Pull versioned datasets
        run: dvc pull

      - name: Validate datasets
        env:
          DATASET_VERSION: ${{ inputs.dataset_version }}
        run: |
          python - <<'PY'
          import os
          from ml.data_validation import (
              validate_version,
              validate_cross_version_consistency,
          )

          validate_version(os.environ["DATASET_VERSION"])
          validate_cross_version_consistency()
          PY

      - name: Check promotion configuration
        if: ${{ inputs.allow_promotion }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Production promotion is only allowed from main."
            exit 1
          fi

          if [[ -z "$APP_URL" ]]; then
            echo "Missing GitHub variable: RENDER_PRODUCTION_URL"
            exit 1
          fi

          if [[ -z "$ADMIN_TOKEN" ]]; then
            echo "Missing GitHub secret: ADMIN_TOKEN"
            exit 1
          fi

      - name: Record previous champion
        id: before
        run: |
          python - <<'PY'
          import os
          from mlflow.tracking import MlflowClient
          from ml.train import setup_mlflow

          setup_mlflow()
          client = MlflowClient()
          champion = client.get_model_version_by_alias(
              os.environ["MODEL_NAME"], "champion"
          )

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"version={champion.version}", file=output)

          print("Previous champion:", champion.version)
          PY

      - name: Run Continuous Training
        id: ct
        continue-on-error: true
        env:
          DATASET_VERSION: ${{ inputs.dataset_version }}
          ALLOW_PROMOTION: ${{ inputs.allow_promotion }}
        run: |
          args=(--version "$DATASET_VERSION")

          if [[ "$ALLOW_PROMOTION" == "true" ]]; then
            args+=(--allow-promotion)
          fi

          python -m ml.continuous_training "${args[@]}"

      - name: Refresh model or restore previous champion
        if: ${{ always() && steps.before.outcome == 'success' && steps.ct.outcome != 'skipped' }}
        env:
          PREVIOUS_VERSION: ${{ steps.before.outputs.version }}
          CT_OUTCOME: ${{ steps.ct.outcome }}
        run: |
          python - <<'PY'
          import json
          import os
          from urllib.request import Request, urlopen

          from mlflow.tracking import MlflowClient
          from ml.train import setup_mlflow
          from ml.rollback import rollback
          from app.model_loader import REFERENCE_SAMPLE

          setup_mlflow()

          name = os.environ["MODEL_NAME"]
          previous = os.environ["PREVIOUS_VERSION"]
          client = MlflowClient()

          def champion_version():
              return str(
                  client.get_model_version_by_alias(
                      name, "champion"
                  ).version
              )

          def api_call(path, method="GET", payload=None, admin=False):
              base = os.environ["APP_URL"].rstrip("/")
              headers = {"Content-Type": "application/json"}

              if admin:
                  headers["X-Admin-Token"] = os.environ["ADMIN_TOKEN"]

              data = (
                  json.dumps(payload).encode("utf-8")
                  if payload is not None
                  else None
              )

              request = Request(
                  base + path,
                  data=data,
                  headers=headers,
                  method=method,
              )

              with urlopen(request, timeout=90) as response:
                  return json.load(response)

          def verify_live(expected_version):
              # Reload the MLflow champion
              reloaded = api_call(
                  "/admin/reload-model",
                  method="POST",
                  admin=True,
              )
              assert str(reloaded["version"]) == expected_version

              # Verify loaded model information
              info = api_call("/model-info")
              assert info["ready"]
              assert info["source"] == "mlflow"
              assert info["model_name"] == name
              assert str(info["version"]) == expected_version

              # Verify readiness
              ready = api_call("/ready")
              assert str(ready["model_version"]) == expected_version

              # Verify an actual prediction
              prediction = api_call(
                  "/predict",
                  method="POST",
                  payload=REFERENCE_SAMPLE,
              )
              assert str(prediction["model_version"]) == expected_version

              print("Live model verification passed:", expected_version)

          current = champion_version()
          print("Previous champion:", previous)
          print("Current champion:", current)

          if current == previous:
              # No promotion occurred: no model refresh required.
              if os.environ["CT_OUTCOME"] != "success":
                  raise RuntimeError("Continuous Training failed")

              print("Champion unchanged. No refresh necessary.")

          else:
              try:
                  if os.environ["CT_OUTCOME"] != "success":
                      raise RuntimeError(
                          "CT failed after changing the champion alias"
                      )

                  verify_live(current)
                  print("Promotion and refresh successful.")

              except Exception as error:
                  print("Live verification failed:", error)
                  print("Rolling back to version:", previous)

                  rollback(previous, model_name=name)

                  assert champion_version() == previous
                  verify_live(previous)

                  raise RuntimeError(
                      "Promotion failed; previous champion restored"
                  ) from error
          PY
