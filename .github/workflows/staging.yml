name: Staging CD

on:
  push:
    branches:
      - staging

permissions:
  contents: read
  packages: write

concurrency:
  group: render-staging
  cancel-in-progress: false

jobs:
  deploy-staging:
    name: Build and validate staging
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image name
        id: image
        shell: bash
        run: |
          IMAGE="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "name=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}

      - name: Deploy to Render staging
        id: deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ vars.RENDER_STAGING_SERVICE_ID }}
          IMAGE: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail

          RESPONSE=$(curl --fail-with-body --silent --show-error \
            -X POST \
            "https://api.render.com/v1/services/$SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg image "$IMAGE" '{imageUrl: $image}')")

          DEPLOY_ID=$(echo "$RESPONSE" | jq -r '.id')

          if [ -z "$DEPLOY_ID" ] || [ "$DEPLOY_ID" = "null" ]; then
            echo "Could not retrieve Render deployment ID"
            exit 1
          fi

          echo "deploy_id=$DEPLOY_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for staging deployment
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ vars.RENDER_STAGING_SERVICE_ID }}
          DEPLOY_ID: ${{ steps.deploy.outputs.deploy_id }}
        shell: bash
        run: |
          set -euo pipefail

          for i in $(seq 1 60); do
            RESPONSE=$(curl --fail-with-body --silent --show-error \
              "https://api.render.com/v1/services/$SERVICE_ID/deploys/$DEPLOY_ID" \
              -H "Authorization: Bearer $RENDER_API_KEY")

            STATUS=$(echo "$RESPONSE" | jq -r '.status')

            echo "Render status: $STATUS"

            case "$STATUS" in
              live)
                echo "Staging deployment is live"
                exit 0
                ;;
              build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                echo "Deployment failed: $STATUS"
                exit 1
                ;;
            esac

            sleep 10
          done

          echo "Deployment timed out"
          exit 1

      - name: HTTP smoke tests
        env:
          BASE_URL: ${{ vars.RENDER_STAGING_URL }}
        shell: bash
        run: |
          set -euo pipefail

          ready=false

          for i in $(seq 1 30); do
            if curl --fail --silent --show-error \
              "$BASE_URL/ready" \
              | jq -e '.status == "ready"' >/dev/null; then
              ready=true
              break
            fi
            sleep 10
          done

          if [ "$ready" != true ]; then
            echo "Staging readiness check failed"
            exit 1
          fi

          curl --fail --silent "$BASE_URL/" \
            | grep -q 'Wine Quality Predictor'

          curl --fail --silent "$BASE_URL/model-info" \
            | jq -e '.ready == true and .source == "mlflow"'

          curl --fail --silent --show-error \
            "$BASE_URL/predict" \
            -H 'Content-Type: application/json' \
            -d '{"fixed_acidity":7.4,"volatile_acidity":0.70,"citric_acid":0.00,"residual_sugar":1.9,"chlorides":0.076,"free_sulfur_dioxide":11.0,"total_sulfur_dioxide":34.0,"density":0.9978,"pH":3.51,"sulphates":0.56,"alcohol":9.4,"is_red":1}' \
            | jq -e '.quality != null and .model_version != null'

          echo "Staging smoke tests passed"

      - name: Save verified image reference
        run: |
          mkdir -p release
          echo "${IMAGE}@${DIGEST}" > release/image.txt
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Upload verified image
        uses: actions/upload-artifact@v4
        with:
          name: verified-image
          path: release/image.txt
          retention-days: 30
