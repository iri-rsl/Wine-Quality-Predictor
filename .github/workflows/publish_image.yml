name: Publish Docker Image

on:
  push:
    branches:
      - staging
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: iri-rsl/wine-quality-predictor

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/iri-rsl/wine-quality-predictor:${{ github.sha }}
            ghcr.io/iri-rsl/wine-quality-predictor:staging
          labels: |
            org.opencontainers.image.source=https://github.com/iri-rsl/Wine-Quality-Predictor
            org.opencontainers.image.revision=${{ github.sha }}
