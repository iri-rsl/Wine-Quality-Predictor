name: CI

on:
  pull_request:
    branches:
      - dev
      - staging
      - main

permissions:
  contents: read

jobs:
  py_syntax:
    name: py_syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Python syntax
        run: python -m compileall -q app ml
     
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.6"
      - name: Lint + import order
        run: ruff check --output-format=github .
      - name: Check formating
        run: ruff format --check .
      
        
  test:
    name: test
    runs-on: ubuntu-latest
    env:
      # Controlled fixtures only: placeholder model, no DagsHub / Azure access.
      MODEL_SOURCE: dummy
      DATABASE_PATH: /tmp/ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest --maxfail=1 -q 
