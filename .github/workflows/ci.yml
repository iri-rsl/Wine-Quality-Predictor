name: CI

on:
  pull_request:
    branches:
      - dev
      - staging
      - main

permissions:
  contents: read

jobs:
  py_syntax:
    name: py_syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Python syntax
        run: python -m compileall -q app ml
     
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.6"
      - name: Lint + import order
        run: ruff check --output-format=github .
      - name: Check formating
        run: ruff format --check .
      
        
  test:
    name: test
    runs-on: ubuntu-latest
    env:
      # Controlled fixtures only: placeholder model, no DagsHub / Azure access.
      MODEL_SOURCE: dummy
      DATABASE_PATH: /tmp/ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest --maxfail=1 -q 

  docker_build:
    name: docker_build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build --tag wine-quality-predictor:${{ github.sha }} .

      - name: Start image and run smoke tests
        shell: bash
        run: |
          set -euo pipefail
          docker run --name wine-quality-predictor --rm -d \
            -p 127.0.0.1:8000:8000 \
            -e MODEL_SOURCE=dummy \
            -e DATABASE_PATH=/app/var/app.db \
            wine-quality-predictor:${{ github.sha }}
          trap 'docker rm -f wine-quality-predictor >/dev/null 2>&1 || true' EXIT

          ready=false
          for _ in {1..60}; do
            if curl --silent --show-error --fail http://127.0.0.1:8000/ready \
                | jq -e '.status == "ready"' >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 1
          done

          if [ "$ready" != true ]; then
            docker logs wine-quality-predictor
            echo "Container did not become ready"
            exit 1
          fi

          curl --fail --silent http://127.0.0.1:8000/ \
            | grep -q 'Wine Quality Predictor'

          curl --fail --silent http://127.0.0.1:8000/model-info \
            | jq -e '.ready == true and .source == "dummy" and .version == "dummy-0"'

          curl --fail --silent --show-error http://127.0.0.1:8000/predict \
            -H 'Content-Type: application/json' \
            -d '{"fixed_acidity":7.4,"volatile_acidity":0.70,"citric_acid":0.00,"residual_sugar":1.9,"chlorides":0.076,"free_sulfur_dioxide":11.0,"total_sulfur_dioxide":34.0,"density":0.9978,"pH":3.51,"sulphates":0.56,"alcohol":9.4,"is_red":1}' \
            | jq -e '.quality != null and .model_version == "dummy-0"'